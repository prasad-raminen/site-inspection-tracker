name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  backend:
    name: API build & tests (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test (unit + integration)
        run: >
          dotnet test --configuration Release --no-build
          --logger "trx;LogFilePrefix=results"
          --results-directory TestResults

      - name: Check EF Core migrations are up to date
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes \
            --project src/SiteInspectionTracker.Infrastructure \
            --startup-project src/SiteInspectionTracker.Api

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: TestResults

  frontend:
    name: Client build & tests (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check & build
        run: npm run build

      - name: Test
        run: npm test

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Build API image
        run: docker build --file src/SiteInspectionTracker.Api/Dockerfile --tag site-inspection-api:ci .

      - name: Build client image
        run: docker build --tag site-inspection-client:ci client
